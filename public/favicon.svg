<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1a1a2e" />
  <circle cx="100" cy="100" r="90" fill="url(#bg)" />
  <circle cx="100" cy="100" r="90" fill="url(#shine)" />

  <!-- Grid lines (logic/structure) subtle -->
  <g clip-path="url(#circle-clip)" stroke="white" stroke-opacity="0.12" stroke-width="1">
    <line x1="10" y1="67" x2="190" y2="67"/>
    <line x1="10" y1="100" x2="190" y2="100"/>
    <line x1="10" y1="133" x2="190" y2="133"/>
    <line x1="67" y1="10" x2="67" y2="190"/>
    <line x1="100" y1="10" x2="100" y2="190"/>
    <line x1="133" y1="10" x2="133" y2="190"/>
  </g>

  <!-- Brain shape - left hemisphere -->
  <path d="M 100 55 C 88 55, 72 58, 65 68 C 56 78, 54 90, 57 100 C 53 108, 52 118, 58 126 C 63 133, 72 136, 80 134 C 83 140, 90 145, 100 145 L 100 55 Z" fill="white" fill-opacity="0.92"/>

  <!-- Brain shape - right hemisphere -->
  <path d="M 100 55 C 112 55, 128 58, 135 68 C 144 78, 146 90, 143 100 C 147 108, 148 118, 142 126 C 137 133, 128 136, 120 134 C 117 140, 110 145, 100 145 L 100 55 Z" fill="white" fill-opacity="0.85"/>

  <!-- Center divide -->
  <line x1="100" y1="58" x2="100" y2="142" stroke="#3b82f6" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Brain folds left -->
  <path d="M 80 72 C 72 78, 70 86, 74 92" stroke="#1d4ed8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M 68 96 C 64 104, 65 114, 70 120" stroke="#1d4ed8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M 82 108 C 78 116, 80 126, 84 130" stroke="#1d4ed8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Brain folds right -->
  <path d="M 120 72 C 128 78, 130 86, 126 92" stroke="#6d28d9" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M 132 96 C 136 104, 135 114, 130 120" stroke="#6d28d9" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M 118 108 C 122 116, 120 126, 116 130" stroke="#6d28d9" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Logic nodes (circuit dots) -->
  <circle cx="80" cy="92" r="3.5" fill="#1d4ed8" fill-opacity="0.8"/>
  <circle cx="70" cy="120" r="3.5" fill="#1d4ed8" fill-opacity="0.8"/>
  <circle cx="120" cy="92" r="3.5" fill="#6d28d9" fill-opacity="0.8"/>
  <circle cx="130" cy="120" r="3.5" fill="#6d28d9" fill-opacity="0.8"/>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="white" stroke-opacity="0.2" stroke-width="1.5"/>
</svg>